<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MarmoApp — Demo Antonio AI</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#111;font-family:'DM Sans',sans-serif}
.shell{display:flex;width:100%;height:100%}
.sb{width:216px;min-width:216px;background:#111;border-right:1px solid #1f1f1f;display:flex;flex-direction:column;height:100%}
.sb-logo{padding:18px 16px 14px;border-bottom:1px solid #1f1f1f;display:flex;align-items:center;gap:10px}
.sb-mark{width:32px;height:32px;flex-shrink:0}
.sb-name{font-size:12px;color:#555;letter-spacing:.3px}
.sb-nav{padding:10px 0;flex:1}
.ni{display:flex;align-items:center;gap:9px;padding:8px 16px;font-size:13px;color:#4a4a4a;border-left:2.5px solid transparent;cursor:pointer}
.ni svg{width:15px;height:15px;flex-shrink:0;opacity:.5}
.ni.active{color:#C9A84C;background:rgba(201,168,76,.07);border-left-color:#C9A84C}
.ni.active svg{opacity:1}
.ni-ai{font-size:9px;font-weight:700;background:rgba(201,168,76,.18);color:#C9A84C;padding:1px 5px;border-radius:4px;margin-left:2px}
.sb-foot{padding:14px 16px;border-top:1px solid #1f1f1f}
.sb-foot-name{font-size:13px;font-weight:600;color:#e0d8cc;margin-bottom:2px}
.sb-foot-links{font-size:11px;color:#444}
.sb-foot-links a{color:#C9A84C;text-decoration:none}
.main{flex:1;display:flex;flex-direction:column;background:#f5f2ee;overflow:hidden}
.ph{background:#fff;border-bottom:1px solid #e8e2d8;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.ph-title{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;color:#1a1511}
.ph-new{font-size:12px;color:#C9A84C;background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.25);padding:6px 12px;border-radius:7px;font-weight:600}
.ph-sub{font-size:11px;color:#b0a89e}
.chat-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
.anto-bar{display:flex;align-items:center;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid #e8e2d8;flex-shrink:0}
.anto-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#C9A84C,#e8cc6a);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:#2C2922;flex-shrink:0}
.anto-name{font-size:14px;font-weight:700;color:#1a1511}
.anto-sub{font-size:11.5px;color:#b0a89e;margin-top:1px}
.anto-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.15);margin-left:auto}
.msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.55;opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.msg.in{opacity:1;transform:translateY(0)}
.msg.user{align-self:flex-end;background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.22);color:#1a1511;border-bottom-right-radius:4px}
.msg.anto{align-self:flex-start;background:#fff;border:1px solid #e8e2d8;color:#2a2520;border-bottom-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.msg strong{color:#C9A84C}
.orc{background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.18);border-radius:9px;padding:11px 13px;margin-top:9px;font-size:12.5px}
.orc-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(201,168,76,.1);color:#7a7168}
.orc-row:last-child{border:none;font-weight:700;color:#C9A84C;padding-top:8px;font-size:13.5px}
.typing{display:flex;gap:4px;align-items:center;padding:10px 14px;background:#fff;border:1px solid #e8e2d8;border-radius:14px;border-bottom-left-radius:4px;align-self:flex-start;opacity:0;transition:.3s;margin-bottom:2px;flex-shrink:0}
.typing.in{opacity:1}
.typing-dot{width:6px;height:6px;border-radius:50%;background:#c0b9b0;animation:bounce 1s infinite}
.typing-dot:nth-child(2){animation-delay:.15s}
.typing-dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px);background:#C9A84C}}
.input-area{padding:12px 20px;background:#fff;border-top:1px solid #e8e2d8;display:flex;gap:10px;align-items:center;flex-shrink:0}
.chat-in{flex:1;background:#faf8f5;border:1.5px solid #e8e2d8;border-radius:9px;padding:10px 14px;font-size:13.5px;color:#b0a89e;font-family:'DM Sans',sans-serif}
.chat-in.active{border-color:#C9A84C;background:#fff;color:#1a1511}
.send-btn{width:36px;height:36px;border-radius:50%;background:#C9A84C;border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
</style>
</head>
<body>
<div class="shell">
<div class="sb">
  <div class="sb-logo">
    <svg class="sb-mark" viewBox="0 0 32 32" fill="none">
      <path d="M4 26L10 8L16 18L22 8L28 26" stroke="#C9A84C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="sb-name">Real Pedras</span>
  </div>
  <div class="sb-nav">
    <div class="ni"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="1" width="6" height="6" rx="1.2"/><rect x="9" y="1" width="6" height="6" rx="1.2"/><rect x="1" y="9" width="6" height="6" rx="1.2"/><rect x="9" y="9" width="6" height="6" rx="1.2"/></svg>Dashboard</div>
    <div class="ni active"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="5.5" r="2.8"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>Antonio <span class="ni-ai">AI</span></div>
    <div class="ni"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="1" width="12" height="14" rx="1.5"/></svg>Orcamentos</div>
    <div class="ni"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="8" cy="5.5" r="2.8"/><path d="M2 14c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg>Clientes</div>
    <div class="ni"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="3" width="14" height="12" rx="1.5"/><line x1="1" y1="7" x2="15" y2="7" stroke="#111" stroke-width="1.2"/><line x1="5" y1="1" x2="5" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="11" y1="1" x2="11" y2="5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Agenda</div>
    <div class="ni"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><polyline points="2,12 5,7 8,9 11,4 14,6"/></svg>Centro de Custos</div>
    <div class="ni"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="4" width="14" height="1.5" rx=".75"/><rect x="1" y="7.5" width="14" height="1.5" rx=".75"/><rect x="1" y="11" width="14" height="1.5" rx=".75"/></svg>Fila de Servicos</div>
    <div class="ni"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/></svg>Estoque</div>
    <div class="ni"><svg viewBox="0 0 16 16" fill="currentColor"><rect x="1" y="9" width="3" height="6" rx="1"/><rect x="6" y="6" width="3" height="9" rx="1"/><rect x="11" y="3" width="3" height="12" rx="1"/></svg>Relatorios</div>
  </div>
  <div class="sb-foot">
    <div class="sb-foot-name">Real Pedras</div>
    <div class="sb-foot-links"><a href="#">Configuracoes</a> · <a href="#">Sair</a></div>
  </div>
</div>
<div class="main">
  <div class="ph">
    <div><div class="ph-title">Antonio</div><div class="ph-sub">Powered by Claude Sonnet · Enterprise</div></div>
    <button class="ph-new">+ Nova conversa</button>
  </div>
  <div class="chat-wrap">
    <div class="anto-bar">
      <div class="anto-av">A</div>
      <div><div class="anto-name">Antonio</div><div class="anto-sub">Especialista em marmoraria</div></div>
      <div class="anto-dot"></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="typing" id="typing">
      <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      <span style="font-size:12px;color:#b0a89e;margin-left:6px">Antonio digitando...</span>
    </div>
    <div class="input-area">
      <div class="chat-in" id="cin">Digite sua mensagem...</div>
      <button class="send-btn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8L14 8M14 8L9 3M14 8L9 13" stroke="#2C2922" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>
</div>
<script>
const msgs=document.getElementById('msgs');
const typing=document.getElementById('typing');
const cin=document.getElementById('cin');

const CONV=[
  {who:'user',text:'Toninho, preciso de um orcamento. Bancada de granito Preto Sao Gabriel, 2,40m por 0,65m, com cuba por baixo.'},
  {who:'wait',ms:1800},
  {who:'anto',html:'Perfeito! Granito Preto Sao Gabriel, acabamento polido.<br>Area: 2,40 x 0,65 = <strong>1,56 m2</strong><div class="orc"><div class="orc-row"><span>Granito Preto Sao Gabriel (1,56m2)</span><span>R$ 1.404,00</span></div><div class="orc-row"><span>Cuba inox embutida por baixo</span><span>R$ 390,00</span></div><div class="orc-row"><span>Mao de obra e instalacao</span><span>R$ 280,00</span></div><div class="orc-row"><span>TOTAL</span><span>R$ 2.074,00</span></div></div>Orcamento salvo. Quer enviar pro cliente?'},
  {who:'pause',ms:2200},
  {who:'user',text:'Sim, manda pro WhatsApp dele.'},
  {who:'wait',ms:1200},
  {who:'anto',html:'Enviado para <strong>Joao Silva</strong> via WhatsApp. checado<br><span style="font-size:12px;color:#b0a89e">Hoje as 21:47</span>'},
  {who:'pause',ms:2400},
  {who:'user',text:'Tenho algo marcado para quinta-feira?'},
  {who:'wait',ms:1500},
  {who:'anto',html:'Sim! Na <strong>quinta-feira, 23 de julho</strong>:<br><br>9h - Instalacao bancada cozinha - Carlos Pereira<br>14h - Medicao banheiro suite - Construtora ABC<br><br>Quer reagendar algum?'},
  {who:'reset',ms:3200},
];

function addMsg(who,html){
  const el=document.createElement('div');
  el.className='msg '+(who==='user'?'user':'anto');
  el.innerHTML=html;
  msgs.appendChild(el);
  msgs.scrollTop=msgs.scrollHeight;
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
}

function typeIn(text,cb){
  cin.classList.add('active');
  cin.textContent='';
  let i=0;
  const iv=setInterval(()=>{
    i++;cin.textContent=text.slice(0,i);
    if(i>=text.length){clearInterval(iv);setTimeout(()=>{cin.textContent='Digite sua mensagem...';cin.classList.remove('active');cb()},350)}
  },28);
}

async function run(queue){
  for(const m of queue){
    await new Promise(res=>{
      if(m.who==='user'){
        typeIn(m.text,()=>{addMsg('user',m.text);setTimeout(res,300)});
      } else if(m.who==='wait'){
        typing.classList.add('in');msgs.scrollTop=msgs.scrollHeight;
        setTimeout(()=>{typing.classList.remove('in');res()},m.ms);
      } else if(m.who==='pause'){
        setTimeout(res,m.ms);
      } else if(m.who==='reset'){
        setTimeout(()=>{
          [...msgs.children].forEach(c=>{c.style.opacity='0';c.style.transform='translateY(6px)'});
          setTimeout(()=>{msgs.innerHTML='';res()},400);
        },m.ms);
      } else {
        addMsg('anto',m.html);setTimeout(res,500);
      }
    });
  }
  run([...CONV]);
}

run([...CONV]);

// Auto-scale: renderiza como 480px de altura e escala para caber no iframe
(function(){function f(){document.documentElement.style.zoom=window.innerHeight/480}window.addEventListener("resize",f);f()})()
</script>
</body>
</html>
